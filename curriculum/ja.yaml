# Japanese course skeleton (A1 → C1), taught in English.
# The writing-systems module (hiragana, katakana) lives in ja_kana.yaml and
# must be completed or tested out of before A1. Kanji are introduced through
# vocab, roughly following JLPT N5 → N1 (A1 ≈ N5, A2 ≈ N4, B1 ≈ N3, B2 ≈ N2,
# C1 ≈ N1). Lesson content always carries furigana markup.

language: ja
name: Japanese

levels:
  A1:
    - unit: Greetings & introductions
      theme: greetings
      objectives: [Greet people politely, Introduce yourself, Ask simple yes/no questions]
      lessons:
        - title: Hello and goodbye
          objectives: [Greet people at different times of day, Thank and apologise]
          vocab: [おはようございます, こんにちは, こんばんは, さようなら, ありがとうございます, すみません, じゃあね, おやすみなさい]
          grammar: [Polite vs casual greetings]
        - title: Nice to meet you
          objectives: [Introduce yourself with your name]
          vocab: [はじめまして, 私, 名前, よろしくお願いします, さん, 先生, 学生, です]
          grammar: [X は Y です, The honorific さん]
        - title: Nationality and work
          objectives: [Say your nationality and job]
          vocab: [日本, 日本人, イギリス, アメリカ, 会社員, 医者, 大学, 何]
          grammar: [Country + 人, The particle の (日本語の先生)]
        - title: Is it…?
          objectives: [Ask and answer yes/no questions]
          vocab: [はい, いいえ, そうです, ちがいます, あなた, 友達, 本当, ええ]
          grammar: [Questions with か, Negative じゃありません]

    - unit: Numbers, time & money
      theme: numbers
      objectives: [Count, Tell the time, Ask prices]
      lessons:
        - title: Numbers
          objectives: [Count to 100, Give a phone number]
          vocab: [一, 二, 三, 四, 五, 十, 百, 電話番号]
          grammar: [Number readings (よん or し and なな or しち)]
        - title: What time is it?
          objectives: [Ask and tell the time]
          vocab: [今, 何時, 〜時, 〜分, 半, 午前, 午後, ごろ]
          grammar: [Time + に, から and まで]
        - title: Days and dates
          objectives: [Say days of the week and dates]
          vocab: [月曜日, 火曜日, 水曜日, 日曜日, 今日, 明日, 昨日, 誕生日]
          grammar: [Irregular date readings (ついたち and はつか)]
        - title: How much is it?
          objectives: [Ask prices and buy things]
          vocab: [円, いくら, これ, それ, あれ, どれ, 高い, 安い]
          grammar: [これ / それ / あれ / どれ, 〜をください]

    - unit: Things & places
      theme: places
      objectives: [Point out things, Say where things and people are]
      lessons:
        - title: This book that bag
          objectives: [Point things out with demonstratives]
          vocab: [この, その, あの, どの, 本, かばん, 傘, 時計]
          grammar: [この / その / あの + noun]
        - title: Where is it?
          objectives: [Ask where places are]
          vocab: [ここ, そこ, あそこ, どこ, トイレ, 駅, 銀行, コンビニ]
          grammar: [X はどこですか, ここ / そこ / あそこ]
        - title: There is
          objectives: [Say what and who is somewhere]
          vocab: [あります, います, 猫, 犬, 机, 部屋, 公園, 誰]
          grammar: [に あります / います, Animate vs inanimate existence]
        - title: On under next to
          objectives: [Describe locations precisely]
          vocab: [上, 下, 中, 外, 前, 後ろ, 隣, 近く]
          grammar: [Noun の 上 に]

    - unit: Daily life
      theme: routine
      objectives: [Describe daily actions, Talk about the past, Say where you go]
      lessons:
        - title: I eat breakfast
          objectives: [Describe daily actions]
          vocab: [食べます, 飲みます, 見ます, 読みます, 起きます, 寝ます, 朝ご飯, 水]
          grammar: [ます verbs, The object particle を]
        - title: Every day
          objectives: [Say when and how often you do things]
          vocab: [毎日, 毎朝, よく, 時々, あまり, 全然, 週末, 働きます]
          grammar: [Frequency adverbs and negative ません]
        - title: Going places
          objectives: [Say where you go and how]
          vocab: [行きます, 来ます, 帰ります, 電車, バス, 歩いて, 学校, 会社]
          grammar: [へ / に for destinations, で for means]
        - title: Yesterday
          objectives: [Talk about what you did]
          vocab: [昨日, 先週, 勉強します, 買います, 会います, 映画, 買い物, 何も]
          grammar: [Past ました / ませんでした]

    - unit: Food & ordering
      theme: food
      objectives: [Order food and drink, Talk about likes, Invite people]
      lessons:
        - title: Food and drink
          objectives: [Name common foods and drinks]
          vocab: [ご飯, 肉, 魚, 野菜, お茶, コーヒー, ビール, 果物]
          grammar: [Listing with と and や]
        - title: At a restaurant
          objectives: [Order politely]
          vocab: [メニュー, 注文, お願いします, 一つ, 二つ, 水, お会計, いらっしゃいませ]
          grammar: [〜をお願いします, Counter つ]
        - title: I like sushi
          objectives: [Say what you like and dislike]
          vocab: [好き, 嫌い, 大好き, 寿司, ラーメン, 甘い, 辛い, 料理]
          grammar: [X が好きです]
        - title: Shall we go?
          objectives: [Invite and accept invitations]
          vocab: [一緒に, 〜ませんか, 〜ましょう, いいですね, ちょっと, 今度, 晩ご飯, 食べに行きます]
          grammar: [〜ませんか / 〜ましょう, Verb stem + に行きます]

    - unit: Describing things
      theme: description
      objectives: [Describe things with adjectives, Compare]
      lessons:
        - title: い-adjectives
          objectives: [Describe things with い-adjectives]
          vocab: [大きい, 小さい, 新しい, 古い, 面白い, 難しい, 暑い, 寒い]
          grammar: [い-adjectives and their negative くないです]
        - title: な-adjectives
          objectives: [Describe things with な-adjectives]
          vocab: [きれい, 静か, 便利, 有名, 元気, 親切, 簡単, にぎやか]
          grammar: [な-adjectives before nouns and じゃないです]
        - title: It was fun
          objectives: [Describe past experiences]
          vocab: [楽しい, つまらない, おいしい, 天気, 旅行, パーティー, どう, とても]
          grammar: [Past adjectives かったです / でした]
        - title: Which is bigger?
          objectives: [Compare two things]
          vocab: [より, ほう, 一番, どちら, 同じ, 速い, 遅い, 一番好き]
          grammar: [A は B より〜, A のほうが, 〜の中で一番]

    - unit: Family & people
      theme: family
      objectives: [Talk about your family, Describe people, Count people and things]
      lessons:
        - title: My family
          objectives: [Name your own family members]
          vocab: [家族, 父, 母, 兄, 姉, 弟, 妹, 両親]
          grammar: [Humble family words for your own family]
        - title: Your family
          objectives: [Ask about someone else's family]
          vocab: [ご家族, お父さん, お母さん, お兄さん, お姉さん, 子ども, 結婚しています, 何人]
          grammar: [Respectful family words, 〜ています for states (結婚しています)]
        - title: Describing people
          objectives: [Describe appearance and personality]
          vocab: [背が高い, 髪, 目, 長い, 短い, 優しい, 明るい, かわいい]
          grammar: [X は Y が Adj (彼女は髪が長いです)]
        - title: Counting
          objectives: [Count people and things]
          vocab: [一人, 二人, 三人, 一つ, 一枚, 一本, 一冊, 何本]
          grammar: [Counters 人 / つ / 枚 / 本 / 冊]

    - unit: Weather & plans
      theme: weather
      objectives: [Talk about weather and seasons, Say what you want to do]
      lessons:
        - title: The weather
          objectives: [Describe the weather]
          vocab: [天気, 晴れ, 雨, 雪, 曇り, 風, 天気予報, 降ります]
          grammar: [Weather expressions (雨が降ります)]
        - title: Seasons
          objectives: [Talk about seasons]
          vocab: [春, 夏, 秋, 冬, 季節, 桜, 紅葉, 暖かい]
          grammar: [〜は〜が好きです for seasons, Adjective te-form preview (暑くて)]
        - title: I want to go to Japan
          objectives: [Say what you want to do]
          vocab: [行きたい, 欲しい, 見たい, 京都, 温泉, お土産, 写真, 撮ります]
          grammar: [Verb stem + たいです, X が欲しいです]
        - title: Weekend plans
          objectives: [Talk about plans]
          vocab: [予定, 週末, 土曜日, 何をしますか, 掃除, 洗濯, 友達と, 家で]
          grammar: [Particles で (place of action) and と (with)]

  A2:
    - unit: The て-form
      theme: te-form
      objectives: [Form the て-form, Make requests, Describe ongoing actions]
      lessons:
        - title: Making the て-form
          objectives: [Conjugate verbs into the て-form]
          vocab: [書いて, 話して, 待って, 遊んで, 来て, して, 行って, 使って]
          grammar: [て-form rules by verb group]
        - title: Please do
          objectives: [Make polite requests]
          vocab: [〜てください, 見せて, 教えて, 手伝って, ゆっくり, もう一度, 名前を書いて, 待ってください]
          grammar: [〜てください]
        - title: I'm doing it now
          objectives: [Describe ongoing actions and states]
          vocab: [〜ています, 住んでいます, 知っています, 持っています, 今, 電話, 雨が降っています, 着ています]
          grammar: [〜ています for progress and states]
        - title: After that
          objectives: [Sequence actions]
          vocab: [〜てから, それから, シャワーを浴びて, 歯を磨いて, 出かけて, 着替えて, 準備, 朝]
          grammar: [〜て〜て for sequences, 〜てから]

    - unit: Rules & permission
      theme: rules
      objectives: [Ask for and give permission, Talk about rules and obligations]
      lessons:
        - title: May I?
          objectives: [Ask permission]
          vocab: [〜てもいいですか, 座って, 窓, 開けて, 写真を撮って, 入って, どうぞ, 大丈夫]
          grammar: [〜てもいいです]
        - title: You must not
          objectives: [State prohibitions]
          vocab: [〜てはいけません, 禁止, たばこを吸って, 走って, 止めて, ここで, 美術館, ルール]
          grammar: [〜てはいけません]
        - title: I have to
          objectives: [Talk about obligations]
          vocab: [〜なければなりません, 薬, 宿題, 返します, 払います, 早く, 締め切り, 出します]
          grammar: [ない-form and 〜なければなりません]
        - title: You don't have to
          objectives: [Say something isn't necessary]
          vocab: [〜なくてもいいです, 靴を脱いで, 予約, 心配, 急いで, 現金, カード, 必要]
          grammar: [〜なくてもいいです]

    - unit: Plain form & casual speech
      theme: plain-form
      objectives: [Use plain forms, Speak casually with friends]
      lessons:
        - title: Dictionary form
          objectives: [Use the plain present]
          vocab: [食べる, 飲む, 行く, 来る, する, 見る, 帰る, 寝る]
          grammar: [Dictionary form by verb group]
        - title: Not doing
          objectives: [Use the plain negative]
          vocab: [食べない, 行かない, ない, 来ない, しない, わからない, 知らない, いない]
          grammar: [ない-form]
        - title: Did it
          objectives: [Use the plain past]
          vocab: [食べた, 行った, した, 来た, 見た, 楽しかった, 静かだった, 雨だった]
          grammar: [た-form and plain past of adjectives]
        - title: Talking with friends
          objectives: [Switch between polite and casual speech]
          vocab: [うん, ううん, そう, だよ, だね, じゃあ, マジ, めっちゃ]
          grammar: [Politeness levels です/ます vs plain, Sentence-ending よ and ね]

    - unit: Experiences & abilities
      theme: experience
      objectives: [Talk about experiences, Say what you can do]
      lessons:
        - title: Have you ever…?
          objectives: [Talk about experiences]
          vocab: [〜たことがあります, 富士山, 登る, 着物, 一度も, 外国, 経験, 何回]
          grammar: [〜たことがある]
        - title: I can…
          objectives: [Say what you can do with ことができる]
          vocab: [〜ことができます, 泳ぐ, 運転する, ピアノ, 弾く, 漢字, 料理する, 歌う]
          grammar: [Dictionary form + ことができる]
        - title: Potential form
          objectives: [Use the potential form]
          vocab: [話せる, 読める, 食べられる, 来られる, できる, 見える, 聞こえる, 上手]
          grammar: [Potential verb forms]
        - title: My hobbies
          objectives: [Talk about hobbies]
          vocab: [趣味, 〜のが好き, 〜こと, 映画を見ること, 釣り, 集める, 絵を描く, 上手 / 下手]
          grammar: [Nominalising with の and こと]

    - unit: Reasons & opinions
      theme: opinions
      objectives: [Give reasons, Share opinions, Report what people said]
      lessons:
        - title: Because
          objectives: [Give reasons]
          vocab: [から, ので, 疲れた, 熱がある, 忙しい, 遅れて, 道が込んでいて, 理由]
          grammar: [から vs ので]
        - title: I think
          objectives: [Give your opinion]
          vocab: [〜と思います, 意見, たぶん, きっと, 便利だと思う, 大切, 賛成, 反対]
          grammar: [Plain form + と思います]
        - title: He said
          objectives: [Report speech]
          vocab: [〜と言いました, 〜って, 伝える, 聞く, 先生が, 明日休み, 〜そうです, ニュース]
          grammar: [Quotation with と言う]
        - title: Probably
          objectives: [Make guesses]
          vocab: [〜でしょう, 〜かもしれません, 明日は晴れる, 多分, 遅れる, 間に合う, 試合, 勝つ]
          grammar: [でしょう and かもしれない]

    - unit: Giving & receiving
      theme: giving
      objectives: [Talk about gifts and favours]
      lessons:
        - title: Giving gifts
          objectives: [Use あげる and もらう]
          vocab: [あげる, もらう, プレゼント, 花, チョコレート, 誕生日に, 彼女, 彼]
          grammar: [あげる / もらう and direction of giving]
        - title: Someone gave me
          objectives: [Use くれる]
          vocab: [くれる, 祖母, 手紙, 送る, 貸す, 借りる, 嬉しい, お礼]
          grammar: [くれる vs あげる]
        - title: Doing favours
          objectives: [Talk about doing things for others]
          vocab: [〜てあげる, 〜てもらう, 〜てくれる, 案内する, 直す, 手伝う, 迎えに行く, 助かる]
          grammar: [Benefactive auxiliaries てあげる / てもらう / てくれる]
        - title: Thank you for…
          objectives: [Thank people for favours]
          vocab: [〜てくれてありがとう, お世話になりました, 感謝, わざわざ, おかげで, 気を使う, 恐縮, とんでもない]
          grammar: [Thanking with 〜てくれて / 〜ていただいて]

    - unit: Conditions
      theme: conditionals
      objectives: [Talk about conditions and consequences]
      lessons:
        - title: If and when (たら)
          objectives: [Use 〜たら]
          vocab: [〜たら, 着いたら, 暇だったら, 雨が降ったら, 安かったら, 終わったら, 連絡, 中止]
          grammar: [〜たら conditional]
        - title: Whenever (と)
          objectives: [Describe automatic consequences]
          vocab: [〜と, 押すと, 曲がると, 春になると, ボタン, 出る, 見える, 右]
          grammar: [〜と for natural consequences]
        - title: If (ば)
          objectives: [Use the ば conditional]
          vocab: [〜ば, 行けば, 安ければ, 時間があれば, 練習すれば, 間に合う, 上手になる, どうすれば]
          grammar: [ば-form]
        - title: If that's the case (なら)
          objectives: [Give advice with なら]
          vocab: [なら, 京都なら, それなら, 行くなら, 買うなら, おすすめ, 一番いい, 場合]
          grammar: [なら for topics and advice]

    - unit: Travel & getting around
      theme: travel
      objectives: [Navigate trains and directions, Book hotels, Make plans]
      lessons:
        - title: Directions
          objectives: [Give and follow directions]
          vocab: [まっすぐ, 曲がる, 右, 左, 角, 信号, 渡る, 道]
          grammar: [〜て行く / 〜て来る, Sequence directions]
        - title: Taking the train
          objectives: [Buy tickets and change trains]
          vocab: [切符, 乗る, 降りる, 乗り換え, 〜番線, 新幹線, 改札, 終電]
          grammar: [に乗る / を降りる]
        - title: At the hotel
          objectives: [Check in and make requests]
          vocab: [予約, チェックイン, 部屋, 鍵, 朝食, 和室, 一泊, 荷物]
          grammar: [Polite requests 〜ていただけますか]
        - title: Let's go
          objectives: [Make plans with the volitional]
          vocab: [行こう, 食べよう, しよう, 〜ようと思う, つもり, 計画, 来年, 留学]
          grammar: [Volitional form and 〜ようと思う / つもり]

  B1:
    - unit: The passive
      theme: passive
      objectives: [Use passive forms in daily life and news]
      lessons:
        - title: Passive forms
          objectives: [Form the passive]
          vocab: [言われる, 呼ばれる, 褒められる, 叱られる, 頼まれる, 招待される, 作られる, 発明]
          grammar: [Passive verb forms]
        - title: Bad luck passive
          objectives: [Express being inconvenienced]
          vocab: [雨に降られる, 足を踏まれる, 財布を盗まれる, 泣かれる, 隣の人, 困る, 迷惑, 被害]
          grammar: [The suffering passive (迷惑の受身)]
        - title: Passive in news and writing
          objectives: [Understand passive in news]
          vocab: [行われる, 建てられる, 発表される, 開かれる, 世界中, 使われている, 輸出, 選ばれる]
          grammar: [Impersonal passive in formal Japanese]
        - title: Telling what happened
          objectives: [Narrate incidents using the passive]
          vocab: [事故, 警察, 届ける, 見つかる, 落とす, 被害届, 犯人, 捕まる]
          grammar: [Passive vs intransitive verbs]

    - unit: The causative
      theme: causative
      objectives: [Make and let people do things, Use causative-passive]
      lessons:
        - title: Make or let
          objectives: [Form the causative]
          vocab: [させる, 行かせる, 食べさせる, 待たせる, 習わせる, 子どもに, 自由に, 親]
          grammar: [Causative 〜せる / 〜させる]
        - title: Let me…
          objectives: [Ask permission politely]
          vocab: [〜させてください, 説明させて, 休ませて, 考えさせて, 担当, 発表, 意見, 一言]
          grammar: [〜させてください / させていただきます]
        - title: Made to do
          objectives: [Use the causative-passive]
          vocab: [飲まされる, 待たされる, 歌わされる, 残業させられる, 無理やり, 部長, 嫌々, 飲み会]
          grammar: [Causative-passive forms]
        - title: At work
          objectives: [Talk about workplace tasks]
          vocab: [上司, 部下, 同僚, 会議, 資料, 担当する, 任せる, 指示]
          grammar: [Causative in workplace contexts]

    - unit: Appearance & hearsay
      theme: hearsay
      objectives: [Express impressions and hearsay]
      lessons:
        - title: It looks…
          objectives: [Describe appearances]
          vocab: [おいしそう, 雨が降りそう, 高そう, 元気そう, 落ちそう, 今にも, 楽しそう, 眠そう]
          grammar: [Stem + そうだ (appearance)]
        - title: I heard that…
          objectives: [Pass on information]
          vocab: [〜そうだ, 〜によると, 天気予報によると, 噂, 結婚するそうだ, 閉店, 値上げ, 聞いた]
          grammar: [Plain form + そうだ (hearsay)]
        - title: It seems
          objectives: [Make inferences]
          vocab: [〜ようだ, 〜みたい, 誰もいないようだ, 風邪みたい, 様子, 気がする, 夢みたい, まるで]
          grammar: [ようだ / みたいだ]
        - title: Apparently
          objectives: [Use らしい]
          vocab: [〜らしい, 男らしい, 春らしい, 来月らしい, 辞める, 本物, 典型的, 噂によると]
          grammar: [らしい for hearsay and typicality]

    - unit: Polite Japanese (keigo)
      theme: keigo
      objectives: [Use honorific and humble language in common situations]
      lessons:
        - title: Honorific language
          objectives: [Use 尊敬語]
          vocab: [いらっしゃる, おっしゃる, 召し上がる, ご覧になる, なさる, お休みになる, お客様, 社長]
          grammar: [尊敬語 special verbs and お〜になる]
        - title: Humble language
          objectives: [Use 謙譲語]
