# ---------------------------------------------------------------------------
# Parlo - host Nginx reverse proxy (same flow as the other sites on this box)
#
# Install to:  /etc/nginx/sites-available/parlo
# Enable with: ln -s /etc/nginx/sites-available/parlo /etc/nginx/sites-enabled/
#
# Deploy in two passes:
#   1. Comment out the 443 server block and the redirect in the port 80 block,
#      reload Nginx, and run: certbot --nginx -d lang.wharveytech.com
#   2. Certbot fills in the certificate paths; uncomment and reload.
#
# The stack's Caddy container is published on 127.0.0.1:7892 (PORT in .env);
# 7888-7891 are taken by the trading dashboard, AutoMail, ScoreSage and IT Desk.
# HTTPS is required: browsers only allow microphone access on secure origins.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=parlo_auth:10m rate=10r/m;

map $http_upgrade $parlo_connection {
    default upgrade;
    ''      "";
}

upstream parlo_app {
    server 127.0.0.1:7892;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name lang.wharveytech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Comment this out during the first Certbot run.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lang.wharveytech.com;

    ssl_certificate     /etc/letsencrypt/live/lang.wharveytech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lang.wharveytech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Voice recordings (≤ 60 s) and exports
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=parlo_auth burst=5 nodelay;
        proxy_pass http://parlo_app;
    }

    # Conversation WebSocket: AI replies stream token by token.
    location ~ ^/api/v1/conversations/\d+/ws$ {
        proxy_pass http://parlo_app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $parlo_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://parlo_app;
        proxy_read_timeout 300s;
    }
}
